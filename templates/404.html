{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}
{% block body %}
<div class="container d-flex align-items-center justify-content-center text-center" style="min-height:90vh">
  <div class="fade-up">
    <h1 class="grad-text" style="font-size:8rem;font-weight:700;line-height:1">404</h1>
    <h3 class="fw-bold">Page Not Found</h3>
    <p class="text-muted">The page you are looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-grad"><i class="bi bi-house"></i> Back Home</a>
  </div>
</div>
{% endblock %}
