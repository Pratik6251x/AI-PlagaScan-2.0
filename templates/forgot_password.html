{% extends "base.html" %}
{% block title %}Forgot Password - PlagiaScan AI Lite{% endblock %}
{% block body %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:90vh">
  <div class="glass auth-card w-100 fade-up">
    <div class="text-center mb-4">
      <i class="bi bi-key fs-1 grad-text"></i>
      <h3 class="fw-bold mt-2">Forgot Password</h3>
      <p class="text-muted">Enter your email to receive a reset link</p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
      </div>
      <button type="submit" class="btn btn-grad w-100"><i class="bi bi-send"></i> Send Reset Link</button>
    </form>
    {% if reset_url %}
    <div class="alert alert-info mt-3 mb-0" role="alert">
      <div class="small mb-2">Demo reset link:</div>
      <a href="{{ reset_url }}" class="alert-link text-break">Open password reset</a>
    </div>
    {% endif %}
    <p class="text-center mt-3 mb-0 text-muted small"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}
