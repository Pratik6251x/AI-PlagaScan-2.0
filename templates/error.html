{% extends "base.html" %}
{% block title %}Error - PlagiaScan AI Lite{% endblock %}
{% block body %}
<div class="container d-flex align-items-center justify-content-center text-center" style="min-height:90vh">
  <div class="glass p-5 fade-up" style="max-width:500px">
    <i class="bi bi-exclamation-triangle fs-1 text-warning"></i>
    <h3 class="fw-bold mt-2">Something went wrong</h3>
    <p class="text-muted">{{ message or 'An unexpected error occurred.' }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-grad"><i class="bi bi-house"></i> Back Home</a>
  </div>
</div>
{% endblock %}
