{% extends "base.html" %}
{% block title %}Reset Password - PlagiaScan AI Lite{% endblock %}
{% block body %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:90vh">
  <div class="glass auth-card w-100 fade-up">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock fs-1 grad-text"></i>
      <h3 class="fw-bold mt-2">Reset Password</h3>
      <p class="text-muted">Choose a new password for your account</p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-control" required minlength="8" maxlength="16" pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*?]).{8,16}$" title="Use 8 to 16 characters with uppercase, lowercase, number, and a special character (!,@,#,$,%,^,&,*,?)">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-grad w-100"><i class="bi bi-check2-circle"></i> Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
